<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#b3261e"><title>Field Checks</title><style>

  /* Layout: one phone-width app column (centered on desktop) under a thin prototype control bar. */
  :root {
    --bg: #eef0f3; --card: #ffffff; --ink: #1c2230; --muted: #667085; --line: #d6dae1; --chip: #eceff3;
    --brand: #b3261e; --brand-ink: #ffffff; --proto: #243040; --proto-ink: #e8edf3;
    --green: #1a7f37; --yellow: #a87503; --red: #c0261c; --na: #6b7280;
    --ok-bg: #e7f4eb; --warn-bg: #fbf3df; --bad-bg: #fcebea; --paper: #ffffff; --paper-ink: #1c2230;
    --t-rtu: #475569; --t-sgas: #c2410c; --t-selec: #9a6a00; --t-hp: #0f766e; --t-uh: #7c3aed; --t-mini: #2563eb; --t-ref: #0e7490;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0e1116; --card: #181c24; --ink: #e7e9ee; --muted: #9aa3b2; --line: #2e3542; --chip: #232936;
    --brand: #c8382f; --proto: #070a0e; --proto-ink: #d7dde6;
    --green: #3fb767; --yellow: #d9a52e; --red: #ef5a4f; --na: #8b93a1;
    --ok-bg: #13291b; --warn-bg: #33290f; --bad-bg: #3b1a17; --paper: #f7f7f5; --paper-ink: #1c2230;
    --t-rtu: #94a3b8; --t-sgas: #fb923c; --t-selec: #facc15; --t-hp: #2dd4bf; --t-uh: #a78bfa; --t-mini: #60a5fa; --t-ref: #22d3ee;
    color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #0e1116; --card: #181c24; --ink: #e7e9ee; --muted: #9aa3b2; --line: #2e3542; --chip: #232936;
    --brand: #c8382f; --proto: #070a0e; --proto-ink: #d7dde6;
    --green: #3fb767; --yellow: #d9a52e; --red: #ef5a4f; --na: #8b93a1;
    --ok-bg: #13291b; --warn-bg: #33290f; --bad-bg: #3b1a17; --paper: #f7f7f5; --paper-ink: #1c2230;
    --t-rtu: #94a3b8; --t-sgas: #fb923c; --t-selec: #facc15; --t-hp: #2dd4bf; --t-uh: #a78bfa; --t-mini: #60a5fa; --t-ref: #22d3ee;
    color-scheme: dark }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.4 var(--font); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--proto); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* Prototype bar */
  .proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--proto); color: var(--proto-ink);
    padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .proto-in { max-width: 560px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; }
  .proto-tag { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; opacity: .8; margin-right: auto; }
  .toggle { display: inline-flex; background: rgba(255,255,255,.08); border-radius: 999px; padding: 3px; gap: 2px; }
  .toggle button { border: 0; background: none; color: inherit; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .toggle button.on { background: var(--proto-ink); color: var(--proto); }
  .chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .chk input { accent-color: var(--brand); width: 16px; height: 16px; }

  /* App header */
  .top { background: var(--brand); color: var(--brand-ink);
    padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top-in { max-width: 560px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .top strong { display: block; font-size: 18px; }
  .top small { opacity: .85; font-size: 12px; }
  .who { font-size: 13px; font-weight: 600; background: rgba(255,255,255,.18); padding: 5px 11px; border-radius: 999px; white-space: nowrap; }

  main { max-width: 560px; margin: 0 auto; padding-block: 12px 120px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; }
  .note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
  .note b { color: var(--ink); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
  h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--brand); }
  h3 { margin: 0; font-size: 19px; text-wrap: balance; }
  .muted { color: var(--muted); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 380px) { .grid2 { grid-template-columns: 1fr; } }
  label.fl, .fl { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
  input:not([type=radio]):not([type=checkbox]), select, textarea { width: 100%; min-height: 44px; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); color: var(--ink); font-size: 16px; font-weight: 400; }
  textarea { min-height: 88px; resize: vertical; }
  .stack { display: grid; gap: 12px; }

  /* Segmented buttons */
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg label { flex: 1 1 0; min-width: 64px; position: relative; }
  .seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .seg span { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 44px; padding: 4px 8px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--chip); font-weight: 600; font-size: 14px; line-height: 1.15; }
  .seg input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 1px; }
  .seg input:checked + span { color: #fff; border-color: transparent; background: var(--ink); }
  .seg input:checked + span { color: var(--card); }
  .seg input:checked[data-tone="green"] + span { background: var(--green); color: #fff; }
  .seg input:checked[data-tone="yellow"] + span { background: var(--yellow); color: #fff; }
  .seg input:checked[data-tone="red"] + span { background: var(--red); color: #fff; }
  .seg input:checked[data-tone="na"] + span { background: var(--na); color: #fff; }
  .seg.big span { min-height: 50px; font-size: 15px; }
  .seg button { flex: 1 1 0; min-height: 48px; border: 1px solid var(--line); border-radius: 8px; background: var(--chip); font-weight: 700; cursor: pointer; }
  .seg button.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }

  /* Chips */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: var(--chip); color: var(--muted); white-space: nowrap; }
  .type { --tc: var(--t-rtu); color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, var(--card)); }
  .type::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tc); }
  .type[data-t="Split Gas System"] { --tc: var(--t-sgas); } .type[data-t="Split Electric System"] { --tc: var(--t-selec); }
  .type[data-t="Heat Pump"] { --tc: var(--t-hp); } .type[data-t="Unit Heater"] { --tc: var(--t-uh); }
  .type[data-t="Mini-Split"] { --tc: var(--t-mini); } .type[data-t="Refrigeration"] { --tc: var(--t-ref); }
  .pill-ok, .pill-bad, .pill-warn, .pill-todo, .pill-next, .pill-off { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .pill-ok { background: var(--ok-bg); color: var(--green); } .pill-bad { background: var(--bad-bg); color: var(--red); }
  .pill-warn { background: var(--warn-bg); color: var(--yellow); } .pill-todo { background: var(--chip); color: var(--muted); }
  .pill-next { background: var(--brand); color: var(--brand-ink); } .pill-off { background: transparent; color: var(--muted); font-weight: 600; }

  /* Unit list */
  .list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .progress { height: 6px; border-radius: 999px; background: var(--chip); overflow: hidden; margin-bottom: 6px; }
  .progress i { display: block; height: 100%; background: var(--green); border-radius: 999px; }
  .unit { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; width: 100%; text-align: left;
    background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 2px; cursor: pointer; color: inherit; }
  .unit:disabled { cursor: default; opacity: .55; }
  .unit .name { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; min-width: 0; flex-wrap: wrap; }
  .unit .sub { grid-column: 1; font-size: 13px; color: var(--muted); }
  .unit .right { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 6px; }
  .unit.is-next { background: color-mix(in srgb, var(--brand) 6%, transparent); border-radius: 8px; }
  .chev { color: var(--muted); font-size: 20px; line-height: 1; }

  .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; min-height: 46px; padding: 0 16px; font-weight: 700; cursor: pointer; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn.ghost { background: transparent; border-style: dashed; color: var(--muted); width: 100%; margin-top: 10px; }
  .btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .linkbtn { background: none; border: 0; color: var(--brand); font-weight: 700; padding: 4px 0; cursor: pointer; }

  /* Checklist */
  .check-head { display: grid; gap: 6px; }
  .jump { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .jump::-webkit-scrollbar { display: none; }
  .jump button { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .jump button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--line); margin-right: 6px; vertical-align: middle; }
  .jump button.done .dot { background: var(--green); } .jump button.flag .dot { background: var(--red); }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .shared { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .shared b { color: var(--ink); font-weight: 700; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field > .fl { color: var(--ink); font-size: 14px; }
  .req { color: var(--red); }
  .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  .row-qty { display: grid; grid-template-columns: 88px 1fr; gap: 8px; }
  .row-amp { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .unit-in { position: relative; }
  .unit-in input { padding-right: 46px; }
  .unit-in em { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--muted); font-size: 14px; pointer-events: none; }
  .invalid { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 8px; }
  #na-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  #na-list li, .issue { font-size: 14px; font-weight: 600; padding: 8px 10px; border-radius: 8px; background: var(--bad-bg); color: var(--red); }
  #na-list li.y, .issue.y { background: var(--warn-bg); color: var(--yellow); }
  #na-list li.none { background: var(--chip); color: var(--muted); font-weight: 500; }

  .barbot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line);
    padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .barbot-in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .barbot-in .btn.primary { flex: 1; }
  .barbot .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; }

  /* Sheet (in-page confirm) */
  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10, 14, 20, .45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; display: grid; gap: 12px;
    padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); max-height: 85vh; overflow: auto; }
  .sheet h3 { font-size: 18px; }
  .sheet ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 2px; }
  .sheet .warn { background: var(--warn-bg); color: var(--yellow); font-weight: 700; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
  .sheet .stop { background: var(--bad-bg); color: var(--red); font-weight: 700; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
  .sheet-actions { display: flex; gap: 10px; } .sheet-actions .btn { flex: 1; }

  /* Admin */
  .tabs { display: flex; gap: 4px; background: var(--chip); border-radius: 10px; padding: 4px; }
  .tabs button { flex: 1; border: 0; background: none; border-radius: 7px; padding: 9px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .tile span { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .tile.alert b { color: var(--red); }
  .cust-h { font-size: 17px; font-weight: 800; margin: 2px 0 4px; }
  .bldg-h { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 10px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .kv .k { color: var(--muted); } .kv .v { font-weight: 700; text-align: right; }
  .v.green { color: var(--green); } .v.yellow { color: var(--yellow); } .v.red, .v.notes { color: var(--red); } .v.na { color: var(--muted); font-weight: 400; }
  .list-ed { display: grid; gap: 8px; }
  .list-ed .chips .chip { font-size: 13px; padding: 5px 6px 5px 11px; color: var(--ink); }
  .list-ed .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 4px; }
  .add-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

  /* Report preview (paper) */
  .paper { background: var(--paper); color: var(--paper-ink); border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.18), 0 10px 30px -12px rgba(0,0,0,.25);
    padding: 22px 18px; font-size: 12px; min-width: 0; }
  .paper h4 { margin: 0; font-size: 18px; }
  .paper .ph { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; border-bottom: 2px solid #b3261e; padding-bottom: 10px; margin-bottom: 12px; }
  .paper .co { font-weight: 800; color: #b3261e; font-size: 13px; }
  .paper .meta { color: #5b6473; font-size: 11.5px; }
  .paper .ptiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
  .paper .ptiles div { background: #eef0f3; border-radius: 4px; padding: 6px 8px; }
  .paper .ptiles b { display: block; font-size: 16px; } .paper .ptiles span { font-size: 9px; text-transform: uppercase; color: #5b6473; font-weight: 700; }
  .ptable-wrap { overflow-x: auto; margin-bottom: 14px; }
  .paper table { width: 100%; border-collapse: collapse; min-width: 440px; }
  .paper th { background: #b3261e; color: #fff; text-align: left; padding: 5px 6px; font-size: 10.5px; }
  .paper td { padding: 5px 6px; border-bottom: 1px solid #e3e6ea; vertical-align: top; }
  .paper td .r { color: #c0261c; font-weight: 700; display: block; } .paper td .y { color: #a87503; font-weight: 700; display: block; } .paper td .ok { color: #1a7f37; font-weight: 700; }
  .punit { border: 1px solid #dfe3e8; margin-bottom: 10px; }
  .punit .uh { background: #1c2230; color: #fff; display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; font-weight: 700; font-size: 11.5px; flex-wrap: wrap; }
  .punit .uh span { font-weight: 400; }
  .punit .band { background: #eef0f3; font-weight: 800; font-size: 10px; letter-spacing: .04em; padding: 3px 8px; text-transform: uppercase; }
  .punit .pgrid { display: grid; grid-template-columns: 1fr 1fr; }
  .punit .pkv { display: flex; justify-content: space-between; gap: 6px; padding: 3px 8px; border-top: 1px solid #eef0f3; font-size: 10.5px; }
  .punit .pkv span:first-child { color: #5b6473; } .punit .pkv b.green { color: #1a7f37; } .punit .pkv b.yellow { color: #a87503; } .punit .pkv b.red { color: #c0261c; }
  .punit .pnotes { padding: 4px 8px; border-top: 1px solid #eef0f3; font-size: 10.5px; color: #c0261c; font-weight: 700; }
  @media (max-width: 420px) { .punit .pgrid { grid-template-columns: 1fr; } .paper .ptiles { grid-template-columns: repeat(2, 1fr); } }

  /* Photos */
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .ph-item { position: relative; border-radius: 8px; overflow: hidden; background: var(--chip); border: 1px solid var(--line); display: grid; min-width: 0; }
  .ph-item img { display: block; width: 100%; max-width: 100%; aspect-ratio: 1; object-fit: cover; cursor: zoom-in; }
  .ph-item select { min-height: 34px; font-size: 12px; padding: 4px 6px; border: 0; border-top: 1px solid var(--line); border-radius: 0; }
  .ph-item .cap { font-size: 11.5px; font-weight: 600; padding: 5px 7px; border-top: 1px solid var(--line); color: var(--ink); line-height: 1.25; }
  .ph-item .x { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 16px; line-height: 1; cursor: pointer; }
  .ph-item .kb { position: absolute; left: 4px; top: 4px; font-size: 10.5px; font-weight: 700; background: rgba(0,0,0,.6); color: #fff; padding: 2px 6px; border-radius: 999px; }
  .addph { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; aspect-ratio: 1;
    border: 1.5px dashed var(--line); border-radius: 8px; color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; text-align: center; padding: 6px; }
  .addph:hover { border-color: var(--brand); color: var(--brand); }
  .addph b { font-size: 26px; line-height: 1; font-weight: 400; }
  .addph input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .addph:focus-within { outline: 2px solid var(--brand); outline-offset: 2px; }
  .fphoto { justify-self: start; font-size: 13.5px; }
  .lb { align-items: center; padding: 16px; flex-direction: column; gap: 10px; }
  .lb img { max-width: 100%; max-height: 75vh; border-radius: 8px; }
  .lb .cap { color: #fff; font-weight: 600; font-size: 14px; text-align: center; }
  .auto { border-color: var(--green) !important; box-shadow: 0 0 0 2px color-mix(in srgb, var(--green) 30%, transparent); }
  .auto.unsure { border-color: var(--yellow) !important; box-shadow: 0 0 0 2px color-mix(in srgb, var(--yellow) 35%, transparent); }
  .ocr { border-color: color-mix(in srgb, var(--green) 45%, var(--line)); background: color-mix(in srgb, var(--green) 6%, var(--card)); display: grid; gap: 8px; }
  .ocr.busy { border-color: var(--line); background: var(--card); }
  .ocr.err { border-color: color-mix(in srgb, var(--red) 40%, var(--line)); background: var(--bad-bg); }
  .ocr .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .ocr .extra { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; }
  .ocr .extra dt { color: var(--muted); } .ocr .extra dd { margin: 0; font-weight: 700; }
  .ocr .unsure-msg { background: var(--warn-bg); color: var(--yellow); font-weight: 700; font-size: 13.5px; padding: 6px 9px; border-radius: 8px; }

    background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; max-width: 90vw; text-align: center;

  .seg.four button, .seg.four { }

  .chip.draft { background: var(--warn-bg); color: var(--yellow); }

  #dummy{}
  [id$="-dout"] { display: flex; flex-wrap: wrap; gap: 6px; }

  .calc { font-size: 22px; font-weight: 700; padding: 8px 12px; border-radius: 10px; background: var(--chip); justify-self: start; min-width: 90px; text-align: center; }
  .calc.green { background: var(--ok-bg); color: var(--green); }
  .calc.yellow { background: var(--warn-bg); color: var(--yellow); }
  .calc.red { background: var(--bad-bg); color: var(--red); }
  .v.yellow { color: var(--yellow); font-weight: 700; } .v.red { color: var(--red); font-weight: 700; } .v.na { color: var(--na); } .v.notes { color: var(--red); white-space: pre-wrap; }
  .jump button.flag .dot { background: var(--red); }
  .req-photo { color: var(--red) !important; font-weight: 700; }
  .addph.req { border-color: var(--red); color: var(--red); }
  .addph small { display: block; font-size: 11px; font-weight: 700; }
  .paper td span.y { color: #a87503; display: block; } .paper td span.r { color: #c0261c; display: block; } .paper td span.ok { color: #1a7f37; }
  .punit .pkv b.yellow { color: #a87503; } .punit .pkv b.red { color: #c0261c; } .punit .pkv b.green { color: #1a7f37; }
  .row-set { display: grid; grid-template-columns: 1fr 90px; align-items: center; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr; gap: 8px; }

  @media print {
    .proto, .top, #bot, #sheet, #toast, .noprint, .tabs, .note { display: none !important; }
    body, html { background: #fff !important; }

    .paper table { width: 100% !important; }

</style></head><body>
<header class="top"><div class="top-in">
  <button type="button" class="home" data-act="home" aria-label="Home: back to visit setup"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h4.5v-6h4v6h4.5V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
  <div class="title"><strong id="app-title">Field Checks</strong><small>Betz Heating &amp; Air</small></div>
  <span class="who" id="who" hidden></span>
</div></header>

<main id="app"></main>
<div id="bot"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// Paste the Apps Script web app URL (ends in /exec) between the quotes:
window.FC_LIVE = true;
window.FC_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxvxfIovytjYtC3DomlWZ03Wt6d6rNbbJEM8c3Rej0Y8xGV9vVlSaLUDTrQdctwi3lS/exec';
(() => {
  // LIVE when the page sets window.FC_LIVE (and FC_SCRIPT_URL, the Apps Script /exec URL); otherwise the sample-data prototype
  const LIVE = !!window.FC_LIVE;
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2));
  // =====================================================================
  //  FIELD LIBRARY
  // =====================================================================
  const NA = 'Not Applicable';
  const GYR = ['Green', 'Yellow', 'Red'], GB = ['Good', 'Bad'];
  const HEATED = ['Gas', 'Electric', 'Heat Pump'];
  const n_ = (n, i) => (n > 1 ? ' ' + i : '');

  // Field types: seg, list (dropdown + other, from a list), qty, num (number, optional N/A), text, textarea,
  // cap (rated + reading, auto condition), outcap (single/dual outdoor run capacitor), calc (temperature split)
  const F = {
    heat: opts => ({ id: 'heatSource', l: 'Heat Source', t: 'seg', o: opts, hint: 'Pre-selected from the system. Changing it shows the sections for that heat source.' }),
    filterCond: () => ({ id: 'filterCond', l: 'Filter Condition', t: 'seg', o: ['Changed', 'Clean'] }),
    filter: (i, opt) => ({ id: 'filter' + i, l: 'Filter Size ' + i, t: 'qty', list: 'Filter Sizes', opt }),
    hv: () => ({ id: 'hv', l: 'High Voltage Condition', t: 'seg', o: GB, bad: ['Bad'] }),
    lv: () => ({ id: 'lv', l: 'Low Voltage Condition', t: 'seg', o: GB, bad: ['Bad'] }),
    blowerCap: () => ({ id: 'blowerCap', l: 'Blower Motor Run Capacitor', t: 'cap', list: 'Blower Cap Sizes', hint: 'Rated size and measured reading; condition is set automatically. ECM / Direct Drive / 3-phase = no capacitor.' }),
    wheel: () => ({ id: 'wheel', l: 'Is Blower Wheel Clean', t: 'seg', o: GYR }),
    attn: () => ({ id: 'attn', l: 'System Needs Attention', t: 'flag', text: 'Something concerning or wrong', opt: true }),
    amps: () => ({ id: 'blowerAmps', l: 'Blower Motor Amp Draw', t: 'num', unit: 'A' }),
  };
  const blowerFields = () => [F.blowerCap(), F.wheel(), F.amps()];

  const SEC = {
    heat: (opts) => ({ key: 'heat', title: 'Heat Source', always: true, fields: [F.heat(opts)] }),
    filters: () => ({ key: 'filters', title: 'Filters', fields: [F.filterCond(), F.filter(1), F.filter(2, true)] }),
    electrical: hs => ({ key: 'electrical', title: 'Electrical', hs, fields: [F.hv(), F.lv()] }),
    beltBlower: hs => ({ key: 'belt-blower', title: 'Belt & Blower', hs, fields: [
      { id: 'beltCond', l: 'Belt Condition', t: 'seg', o: ['Green', 'Red', 'Direct Drive'],
        fills: { when: 'Direct Drive', set: { beltSize: 'Direct Drive', blowerCap: { rated: 'ECM/Direct Drive/3phase' } } } },
      { id: 'beltSize', l: 'Belt Size', t: 'text', ph: 'e.g. A42' }, ...blowerFields()] }),
    blower: hs => ({ key: 'blower', title: 'Blower', hs, fields: blowerFields() }),
    inducer: (n, hs, naFirst) => ({ key: 'inducer', title: 'Inducer', hs, fields: Array.from({ length: n }, (_, k) => {
      const i = k + 1, set = {}, allowNA = i > 1 || naFirst || n > 1;
      set['indAmps' + i] = NA;
      for (let j = i + 1; j <= n; j++) { set['ind' + j] = { rated: NA }; set['indAmps' + j] = NA; }
      return [{ id: 'ind' + i, l: 'Inducer Fan Motor' + n_(n, i) + ' Run Capacitor', t: 'cap', list: 'Inducer Cap Sizes', allowNA,
        fills: allowNA ? { when: NA, set } : null },
        { id: 'indAmps' + i, l: 'Inducer Fan Motor' + n_(n, i) + ' Amp Draw', t: 'num', unit: 'A', na: allowNA }];
    }).flat() }),
    gas: (n, ign, hs) => {
      const stage2 = { hx2: NA, ps2: NA, ig2: NA, gv2: NA }, f = [];
      const two = i => i > 1;
      for (let i = 1; i <= n; i++) f.push({ id: 'hx' + i, l: 'Heat Exchanger' + n_(n, i) + ' Condition', t: 'seg', o: two(i) ? [...GYR, NA] : GYR, fills: i === 2 ? { when: NA, set: { ps2: NA, ig2: NA, gv2: NA } } : null });
      f.push({ id: 'gasLeak', l: 'Gas Leaks Detected', t: 'seg', o: ['No', 'Yes'], bad: ['Yes'] });
      f.push({ id: 'flame', l: 'Flame Sensor Condition', t: 'seg', o: ['Sanded', 'Good', 'Bad'], bad: ['Bad'], hint: 'Good = working but not easily accessible' });
      for (let i = 1; i <= n; i++) f.push({ id: 'ps' + i, l: 'Pressure Switch' + n_(n, i), t: 'seg', o: [...GB, NA], bad: ['Bad'] });
      for (let i = 1; i <= n; i++) f.push({ id: 'ig' + i, l: ign + n_(n, i) + ' Condition', t: 'seg', o: two(i) ? [...GB, NA] : GB, bad: ['Bad'] });
      for (let i = 1; i <= n; i++) f.push({ id: 'gv' + i, l: 'Gas Valve' + n_(n, i), t: 'seg', o: two(i) ? [...GB, NA] : GB, bad: ['Bad'], fills: i === 2 ? { when: NA, set: { hx2: NA, ps2: NA, ig2: NA } } : null });
      f.push({ id: 'limit', l: 'High Limit Condition', t: 'seg', o: GB, bad: ['Bad'] }, { id: 'safeties', l: 'Safeties Condition', t: 'seg', o: GB, bad: ['Bad'] });
      return { key: 'gas', title: 'Gas & Safeties', hs, fields: f };
    },
    venting: hs => ({ key: 'venting', title: 'Combustion & Venting', hs, fields: [
      { id: 'co', l: 'Carbon Monoxide Leaks Detected', t: 'seg', o: ['No', 'Yes'], bad: ['Yes'] },
      { id: 'vent', l: 'Vent Stack Attached and Free of Debris', t: 'seg', o: ['Yes', 'No'], bad: ['No'] }] }),
    elecHeat: (title, hs) => ({ key: 'electric-heat', title, hs, fields: [
      { id: 'kit', l: 'Heat Kit Size', t: 'list', list: 'Heat Kit Sizes', unit: 'kW' },
      ...[1, 2, 3, 4].map(i => ({ id: 'el' + i, l: 'Heating Element ' + i + ' Amp Draw', t: 'num', unit: 'A', na: i > 1, zeroBad: true, hint: i === 2 ? 'A reading of 0 is flagged Red' : '',
        fills: i < 4 ? { when: NA, set: Object.fromEntries([...Array(4 - i)].map((_, k) => ['el' + (i + 1 + k), NA])) } : null })),
      { id: 'relays', l: 'Relays Condition', t: 'seg', o: GB, bad: ['Bad'] },
      { id: 'elimit', l: 'High Limit Switch Condition', t: 'seg', o: GB, bad: ['Bad'] }] }),
    hpHeat: ({ circuits, comps, temps, suction }, hs) => {
      const f = [
        { id: 'evapClean', l: 'Is Evaporator Coil Clean?', t: 'seg', o: GYR },
        { id: 'rv', l: 'Reversing Valve', t: 'seg', o: GB, bad: ['Bad'] },
        { id: 'defrost', l: 'Defrost Cycle', t: 'seg', o: GB, bad: ['Bad'] },
        { id: 'odCoil', l: 'Outdoor Coil', t: 'seg', o: GYR },
        ...outcaps(circuits)];
      for (let i = 1; i <= circuits; i++) f.push({ id: 'hpFanAmps' + i, l: 'Condenser Fan Motor' + n_(circuits, i) + ' Amp Draw', t: 'num', unit: 'A', na: i > 1 });
      for (let i = 1; i <= comps; i++) {
        const set = {}; for (let j = i + 1; j <= comps; j++) set['comp' + j] = NA;
        f.push({ id: 'comp' + i, l: 'Compressor' + n_(comps, i) + ' Run Amps', t: 'num', unit: 'A', na: i > 1, fills: i > 1 && i < comps ? { when: NA, set } : null,
          hint: i === 2 && comps > 2 ? 'Not Applicable here also marks the higher compressors Not Applicable' : '' });
      }
      if (suction) for (let i = 1; i <= circuits; i++) f.push(
        { id: 'hpSuction' + i, l: 'Suction Pressure' + n_(circuits, i), t: 'num', unit: 'psig', na: i > 1 },
        { id: 'hpSuperheat' + i, l: 'Superheat' + n_(circuits, i), t: 'num', unit: '°F', na: i > 1 });
      f.push({ id: 'oat', l: 'Outdoor Air Temperature', t: 'num', unit: '°F', hint: 'Gives the readings context: heat pump output drops as it gets colder outside' });
      if (temps) f.push(
        { id: 'hpReturn', l: 'Return Air Temperature', t: 'num', unit: '°F' },
        { id: 'hpSupply', l: 'Supply Air Temperature', t: 'num', unit: '°F' },
        { id: 'hpRise', l: 'Temperature Rise', t: 'calc', mode: 'hprise', from: ['hpSupply', 'hpReturn'], hint: 'Supply − return, with auxiliary heat off. Calculated.' });
      return { key: 'heat-pump', title: 'Heat Pump', hs, fields: f };
    },
    circuit: n => {
      const f = [];
      for (let i = 1; i <= n; i++) {
        const s = n_(n, i), na = i > 1;
        const set = { ['outcap' + i]: { kind: NA }, ['compAmps' + i]: NA, ['fanAmps' + i]: NA, ['suction' + i]: NA, ['liquid' + i]: NA, ['superheat' + i]: NA, ['subcool' + i]: NA };
        f.push({ id: 'contactor' + i, l: 'Contactor' + s, t: 'seg', o: na ? [...GYR, NA] : GYR, fills: na ? { when: NA, set } : null, hint: na ? 'Not Applicable marks the rest of circuit 2 Not Applicable' : '' },
          ...outcaps(1, i, n, na),
          { id: 'compAmps' + i, l: 'Compressor Amp Draw' + s, t: 'num', unit: 'A', na },
          { id: 'fanAmps' + i, l: 'Condenser Fan Amp Draw' + s, t: 'num', unit: 'A', na },
          { id: 'suction' + i, l: 'Suction Pressure' + s, t: 'num', unit: 'psig', na },
          { id: 'liquid' + i, l: 'Liquid Pressure' + s, t: 'num', unit: 'psig', na },
          { id: 'superheat' + i, l: 'Superheat' + s, t: 'num', unit: '°F', na },
          { id: 'subcool' + i, l: 'Subcooling' + s, t: 'num', unit: '°F', na });
      }
      f.push({ id: 'refAdded', l: 'Refrigerant Added', t: 'num', unit: 'lbs', opt: true });
      return { key: 'circuit', title: 'Refrigeration Circuit', fields: f };
    },
    coils: pan => ({ key: 'coils', title: 'Coils & Drain', fields: [
      { id: 'evapCoil', l: 'Evaporator Coil Condition', t: 'seg', o: GYR },
      { id: 'condCoil', l: 'Condenser Coil Condition', t: 'seg', o: GYR },
      { id: 'condCleaned', l: 'Condenser Coil Cleaned', t: 'seg', o: ['Yes', 'No'] },
      { id: 'drain', l: 'Condensate Drain', t: 'seg', o: ['Clear', 'Slow', 'Clogged'], warn: ['Slow'], bad: ['Clogged'] },
      ...(pan ? [{ id: 'pan', l: 'Drain Pan Condition', t: 'seg', o: GYR }, { id: 'float', l: 'Float / Safety Switch', t: 'seg', o: [...GB, NA], bad: ['Bad'] }] : [])] }),
    airflow: () => ({ key: 'airflow', title: 'Airflow', fields: [
      { id: 'coolReturn', l: 'Return Air Temperature', t: 'num', unit: '°F' },
      { id: 'coolSupply', l: 'Supply Air Temperature', t: 'num', unit: '°F' },
      { id: 'coolSplit', l: 'Temperature Split', t: 'calc', mode: 'cool', from: ['coolReturn', 'coolSupply'], hint: 'Return − supply. Calculated.' }] }),
    hpCool: () => ({ key: 'heat-pump-cool', title: 'Heat Pump', hs: ['Heat Pump'], fields: [{ id: 'rvCool', l: 'Reversing Valve (cooling mode)', t: 'seg', o: GB, bad: ['Bad'] }] }),
    duct: hs => ({ key: 'duct', title: 'Ductwork', hs, fields: [{ id: 'duct', l: 'Ductwork Condition', t: 'seg', o: ['Good', 'Deteriorating', 'Bad'], warn: ['Deteriorating'], bad: ['Bad'] }] }),
    tstat: hs => ({ key: 'tstat', title: 'Thermostat & Notes', always: true, fields: [
      { id: 'tstat', l: 'Is Thermostat Working Properly', t: 'seg', o: GB, bad: ['Bad'], hs },
      F.attn(),
      { id: 'notes', l: 'Notes', t: 'textarea', opt: true }] }),
  };
  function outcaps(circuits, only, total, naFirst) {
    const list = [];
    const from = only || 1, to = only || circuits, n = total || circuits;
    for (let i = from; i <= to; i++) list.push({ id: 'outcap' + i, l: 'Outdoor Run Capacitor' + n_(n, i), t: 'outcap', allowNA: naFirst || i > 1,
      hint: 'Single: compressor and condenser fan capacitors (fan can be ECM). Dual: one size like 45+5 with both readings.' });
    return list;
  }

  const CHECKLISTS = {
    'RTU|Heating': () => [SEC.heat(['Gas', 'Electric', 'Heat Pump', 'None']), SEC.filters(), SEC.electrical(HEATED), SEC.beltBlower(HEATED), SEC.inducer(2, ['Gas']),
      SEC.gas(2, 'Spark Ignitor', ['Gas']), SEC.elecHeat('Electric / Auxiliary Heat', ['Electric', 'Heat Pump']), SEC.hpHeat({ circuits: 2, comps: 4, temps: true }, ['Heat Pump']), SEC.tstat(HEATED)],
    'Residential Split System|Heating': () => [SEC.heat(['Gas', 'Electric', 'Heat Pump', 'None']), SEC.filters(), SEC.electrical(HEATED), SEC.blower(HEATED), SEC.inducer(1, ['Gas']),
      SEC.gas(1, 'Hot Surface Ignitor', ['Gas']), SEC.venting(['Gas']), SEC.elecHeat('Electric / Auxiliary Heat', ['Electric', 'Heat Pump']), SEC.hpHeat({ circuits: 1, comps: 1, suction: true }, ['Heat Pump']),
      SEC.duct(HEATED), SEC.tstat(HEATED)],
    'Commercial Split System|Heating': () => [SEC.heat(['Gas', 'Electric', 'Heat Pump', 'None']), SEC.filters(), SEC.electrical(HEATED), SEC.beltBlower(HEATED), SEC.inducer(2, ['Gas']),
      SEC.gas(2, 'Spark Ignitor', ['Gas']), SEC.elecHeat('Electric / Auxiliary Heat', ['Electric', 'Heat Pump']), SEC.hpHeat({ circuits: 2, comps: 2, temps: true, suction: true }, ['Heat Pump']), SEC.tstat(HEATED)],
    'Unit Heater|Heating': () => [SEC.heat(['Gas', 'Electric']), SEC.electrical(), SEC.beltBlower(), SEC.inducer(1, ['Gas'], true), SEC.gas(1, 'Ignitor', ['Gas']), SEC.venting(['Gas']),
      SEC.elecHeat('Electric Heat', ['Electric']), SEC.tstat()],
    'RTU|Cooling': () => [SEC.heat(['Gas', 'Electric', 'Heat Pump', 'None']), SEC.filters(), SEC.electrical(), SEC.beltBlower(), SEC.circuit(2), SEC.coils(false), SEC.airflow(), SEC.hpCool(), SEC.tstat()],
    'Residential Split System|Cooling': () => [SEC.heat(['Gas', 'Electric', 'Heat Pump', 'None']), SEC.filters(), SEC.electrical(), SEC.blower(), SEC.circuit(1), SEC.coils(true), SEC.airflow(), SEC.hpCool(), SEC.duct(), SEC.tstat()],
    'Commercial Split System|Cooling': () => [SEC.heat(['Gas', 'Electric', 'Heat Pump', 'None']), SEC.filters(), SEC.electrical(), SEC.beltBlower(), SEC.circuit(2), SEC.coils(true), SEC.airflow(), SEC.hpCool(), SEC.duct(), SEC.tstat()],
    'RTU|Filters': () => [SEC.filters(), { key: 'notes', title: 'Notes', fields: [F.attn(), { id: 'notes', l: 'Notes', t: 'textarea', opt: true }] }],
    'Residential Split System|Filters': () => CHECKLISTS['RTU|Filters'](),
    'Commercial Split System|Filters': () => CHECKLISTS['RTU|Filters'](),
  };
  const CHECKS = ['Cooling', 'Heating', 'Filters', 'Inspection'];
  const CHECK_LABEL = { Cooling: 'Cooling maintenance', Heating: 'Heating maintenance', Filters: 'Filter change', Inspection: 'Inspection' };
  const DRAFT = { Cooling: true };

  const PH_WAIT = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120"><rect width="160" height="120" fill="#d6dae1"/><text x="80" y="65" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#667085">Loading photo…</text></svg>');
  async function ensurePhotos(list) {

      ['Condition', INSP_COND.filter(c => c.k !== 'notes').map(c => c.t === 'flag' ? [c.l, a[c.k] === 'Yes' ? 'Yes' : 'No', a[c.k] === 'Yes' ? 'red' : ''] : [c.l, a[c.k], (c.badV || []).includes(a[c.k]) ? 'red' : (c.warnV || []).includes(a[c.k]) ? 'yellow' : a[c.k] ? 'green' : 'na'])],
      ['Notes', [['Notes', a.notes, 'notes']]]];
    const heat = a.heatSource, get = id => a[id], out = [];
    recSections(rec).forEach(sec => {
      if (sec.hs && !visibleSection(sec, heat)) return;
      const items = sec.fields.filter(f => visibleField(f, heat)).map(f => {
        const v = a[f.id], sv = evaluate(f, v, get), txt = show(f, v, get);
        let cls = f.id === 'notes' ? 'notes' : sv || (v === 'Green' || v === 'Good' ? 'green' : '');
        if (!sv && (f.t === 'cap' || f.t === 'outcap' || f.t === 'calc') && txt && txt !== NA) cls = 'green';
        if (!txt || txt === NA) cls = f.id === 'notes' ? 'notes' : 'na';
        return [f.l, txt, cls];
      });
      if (items.length) out.push([sec.title, items]);
    });
    return out;
  }
  function renderDetail() {
    const r = S.rec, s = sysById(r.systemId), issues = issuesOf(r);
    if (LIVE) ensurePhotos(r.photos).then(n => { if (n && S.admin === 'detail' && S.rec === r) render(); });
    $('app').innerHTML = `
      <button type="button" class="linkbtn" data-act="adminTab" data-v="report" style="justify-self:start">‹ Report</button>
      <section class="card check-head"><h3>System ${esc(s.number)}</h3><div class="chips">${typeChip(s.type)}<span class="chip">${CHECK_LABEL[r.check]}</span></div>
        <div class="muted">${esc(r.customer)} · ${esc(r.building)} · ${esc(r.tech)} · ${when(r.time)}</div><div class="muted">${esc(sysSub(s))}</div>
        ${r.check !== 'Inspection' ? '<button type="button" class="btn sm" data-act="editRec" style="justify-self:start;margin-top:6px">Edit answers</button>' : ''}</section>
      <section class="card"><div class="sec-head"><h2>Needs attention</h2></div><div class="stack" style="gap:6px">${issues.length ? issues.map(x => `<div class="issue ${x.s === 'yellow' ? 'y' : ''}">${esc(x.t)}</div>`).join('') : '<div class="muted">Nothing flagged</div>'}</div></section>
      ${answerSections(r).map(([t, items]) => `<section class="card"><h2>${esc(t)}</h2>${items.map(([k, v, c]) => `<div class="kv"><span class="k">${esc(k)}</span><span class="v ${c || ''}">${esc(v || '—')}</span></div>`).join('')}</section>`).join('')}
      ${r.photos.length ? `<section class="card"><h2 style="margin-bottom:10px">Photos</h2><div class="photos">${r.photos.map((p, i) => ` <div class="ph-item"><img src="${p.url || PH_WAIT}" alt="${esc(p.tag)}" data-act="recPhoto" data-i="${i}"><div class="cap">${esc(p.tag)}</div></div>`).join('')}</div></section>` : ''}
      <section class="card stack"><h2>System info</h2>${INSP.map(c => `<div class="kv"><span class="k">${esc(c.l)}</span><span class="v">${esc(s[c.k] || (c.k === 'suite' ? 'N/A' : c.k === 'area' ? 'Unknown' : '—'))}</span></div>`).join('')}
        <div class="kv"><span class="k">Age</span><span class="v">${ageOf(s.mfg) != null ? ageOf(s.mfg) + ' years' : '—'}</span></div></section>`;
  }
  function renderPreview() {
    const rows = filtered().slice().sort((a, b) => a.customer.localeCompare(b.customer) || a.building.localeCompare(b.building) || Number(sysById(a.systemId).number) - Number(sysById(b.systemId).number));
    const cv = S.custVersion, multi = !S.af.cust, pv = v => (!v || v === NA ? '—' : v);
    const withIssues = rows.filter(r => issuesOf(r).length).length;
    if (LIVE) { const ph = rows.flatMap(r => cv ? r.photos.filter(p => p.tag.startsWith('Issue:')) : r.photos); ensurePhotos(ph).then(n => { if (n && S.admin === 'preview') render(); }); }
    const range = LIVE ? (S.af.from === S.af.to ? new Date(S.af.from + 'T12:00').toLocaleDateString() : `${new Date(S.af.from + 'T12:00').toLocaleDateString()} – ${new Date(S.af.to + 'T12:00').toLocaleDateString()}`) : TODAY.toLocaleDateString();
    $('app').innerHTML = `
      <button type="button" class="linkbtn noprint" data-act="adminTab" data-v="report" style="justify-self:start">‹ Report</button>
      <button type="button" class="btn primary noprint" data-act="print">Save as PDF</button>
      <section class="card stack noprint"><label class="chk" style="font-weight:600"><input type="checkbox" id="cust-version" ${cv ? 'checked' : ''}> Customer version (no technician names, issue photos only)</label>
        <div class="muted">${esc(S.af.cust || 'All customers')}${S.af.bldg ? ' · ' + esc(S.af.bldg) : ''} · ${esc(S.af.check ? CHECK_LABEL[S.af.check] : 'All checks')}</div></section>
      <div class="paper">
        <div class="ph"><div><div class="co">Betz Heating &amp; Air</div><h4>Maintenance Check Report</h4><div class="meta">${esc(S.af.cust || 'All customers')}${S.af.bldg ? ' · ' + esc(S.af.bldg) : ''} · ${range}</div></div><div class="meta" style="text-align:right">${rows.length} systems</div></div>
        <div class="ptiles"><div><b>${rows.length}</b><span>Systems checked</span></div><div><b style="color:${withIssues ? '#c0261c' : 'inherit'}">${withIssues}</b><span>With issues</span></div>
          <div><b>${rows.filter(r => r.answers.filterCond === 'Changed').length}</b><span>Filters changed</span></div><div><b>${rows.filter(r => r.answers.heatSource === 'None').length}</b><span>No-heat systems</span></div></div>
        <div class="ptable-wrap"><table><thead><tr>${multi ? '<th>Customer</th>' : ''}<th>Bldg</th><th>System</th><th>Type</th><th>Age</th><th>Refrig.</th><th>Check</th>${cv ? '' : '<th>Tech</th>'}<th>Needs attention</th></tr></thead><tbody>
          ${rows.map(r => { const s = sysById(r.systemId), iss = issuesOf(r); return `<tr>${multi ? `<td>${esc(r.customer)}</td>` : ''}<td>${esc(r.building)}</td><td><b>${esc(s.number)}</b>${s.suite ? `<br><small>Suite ${esc(s.suite)}</small>` : ''}</td><td>${esc(TYPE_SHORT[s.type])}</td>
            <td>${ageOf(s.mfg) != null ? ageOf(s.mfg) + ' yrs' : '—'}</td><td>${esc(s.refrigerant || '—')}</td><td>${esc(r.check)}</td>${cv ? '' : `<td>${esc(r.tech)}</td>`}
            <td>${iss.length ? iss.map(x => `<span class="${x.s === 'yellow' ? 'y' : 'r'}">${esc(x.t)}</span>`).join('') : '<span class="ok">OK</span>'}</td></tr>`; }).join('')}</tbody></table></div>
        ${rows.map(r => { const s = sysById(r.systemId), photos = cv ? r.photos.filter(p => p.tag.startsWith('Issue:')) : r.photos; return `<div class="punit">
          <div class="uh">${esc(r.customer)} — ${esc(r.building)}, System ${esc(s.number)} · ${esc(s.type)}${s.suite ? ' · Suite ' + esc(s.suite) : ''} <span>${ageOf(s.mfg) != null ? ageOf(s.mfg) + ' yrs · ' : ''}${esc(s.refrigerant || '')} · ${esc(r.check)}${cv ? '' : ' · ' + esc(r.tech)} · ${when(r.time)}</span></div>
          ${answerSections(r).map(([t, items]) => `<div class="band">${esc(t)}</div>${items.some(i => i[2] === 'notes') && items.length === 1 ? `<div class="pnotes">${esc(items[0][1] || '—')}</div>`
            : `<div class="pgrid">${items.filter(i => i[2] !== 'notes').map(([k, v, c]) => `<div class="pkv"><span>${esc(k)}</span><b class="${c === 'na' ? '' : (c || '')}">${esc(pv(v))}</b></div>`).join('')}</div>${items.filter(i => i[2] === 'notes').map(i => `<div class="pnotes">${esc(i[1] || '—')}</div>`).join('')}`}`).join('')}
          ${photos.length ? `<div class="band">Photos</div><div class="pphotos">${photos.map(p => `<figure><img src="${p.url || PH_WAIT}" alt="${esc(p.tag)}"><figcaption>${esc(p.tag.replace(/^Issue: /, ''))}</figcaption></figure>`).join('')}</div>` : ''}</div>`; }).join('')}
      </div>`;
  }
  function renderLists() {
    if (LIVE) { $('app').innerHTML = `${adminTabs('lists')}<section class="card muted">These come from the <b>Lists</b> tab of the Field Checks spreadsheet. Change them there, then use Reload (tap your name at the top).</section>
      ${Object.entries(LISTS).map(([k, items]) => `<section class="card list-ed"><h2>${esc(k)}</h2><div class="chips">${items.map(it => `<span class="chip">${esc(it)}</span>`).join('')}</div></section>`).join('')}`; return; }
    $('app').innerHTML = `${adminTabs('lists')}${note('<b>Lists you can change without new code.</b> In the real build these are columns on a Lists tab in the spreadsheet. Every dropdown that uses a list also allows a custom entry.')}
      ${Object.entries(LISTS).map(([k, items]) => `<section class="card list-ed"><h2>${esc(k)}</h2><div class="chips">${items.map((it, i) => `<span class="chip">${esc(it)}<button type="button" data-act="listDel" data-k="${esc(k)}" data-i="${i}" aria-label="Remove ${esc(it)}">×</button></span>`).join('')}</div>
        <div class="add-row"><input id="add-${esc(k).replace(/\s/g, '_')}" placeholder="Add to ${esc(k.toLowerCase())}"><button type="button" class="btn sm" data-act="listAdd" data-k="${esc(k)}">Add</button></div></section>`).join('')}`;
  }
  function renderSettings() {
    if (LIVE) { $('app').innerHTML = `${adminTabs('settings')}<section class="card muted">Thresholds come from the <b>Settings</b> tab and required photos from the <b>Photo Rules</b> tab of the spreadsheet. Change them there, then use Reload.</section>
      <section class="card stack"><h2>Thresholds</h2>${Object.values(SETTINGS).map(x => `<div class="kv"><span class="k">${esc(x.l)}</span><span class="v">${esc(x.v)}</span></div>`).join('')}</section>
      <section class="card stack"><h2>Required photos</h2>${PHOTO_RULES.map(r => `<div class="rule"><span><b>${esc(r.checklist)}</b> · ${esc(r.field)} · <i>${esc(r.when)}</i></span></div>`).join('') || '<div class="muted">None</div>'}</section>`; return; }
    $('app').innerHTML = `${adminTabs('settings')}${note('<b>Thresholds and photo rules.</b> In the real build these are the Settings and Photo Rules tabs in the spreadsheet, editable without new code. Changes here apply immediately in this prototype.')}
      <section class="card stack"><h2>Thresholds</h2>${Object.entries(SETTINGS).map(([k, s]) => `<label class="fl row-set">${esc(s.l)}<input type="number" step="any" data-setting="${k}" value="${s.v}"></label>`).join('')}</section>
      <section class="card stack"><h2>Required photos</h2><div class="muted">Checklist and field accept * wildcards. When = Always, or answers separated by commas.</div>
        ${PHOTO_RULES.map((r, i) => `<div class="rule"><span><b>${esc(r.checklist)}</b> · ${esc(r.field)} · <i>${esc(r.when)}</i></span><button type="button" class="linkbtn" data-act="ruleDel" data-i="${i}">Remove</button></div>`).join('')}
        <div class="grid3"><input id="r-list" placeholder="Checklist, e.g. *Cooling"><input id="r-field" placeholder="Field, e.g. Condenser Coil*"><input id="r-when" placeholder="When, e.g. Red"></div>
        <button type="button" class="btn sm" data-act="ruleAdd" style="justify-self:start">Add rule</button></section>`;
  }

  // ---------------------------------------------------------------- SHEET
  function sheet(html) { $('sheet').innerHTML = `<div class="scrim" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }

  // =====================================================================
  //  EVENTS
  // =====================================================================
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const a = t.dataset.act;
    if (a === 'closeSheet' && e.target !== t && !e.target.matches('button')) return;
    switch (a) {
      case 'role': S.role = t.dataset.v; S.view = 'visit'; S.editing = null; if (S.role === 'admin') S.admin = 'report'; render(); window.scrollTo(0, 0); break;
      case 'setCheck': S.visit.check = t.dataset.v; S.addOpen = false; render(); break;
      case 'openSys': { const s = sysById(t.dataset.id);
        if (S.visit.check === 'Inspection') { S.sys = { ...s }; const ir = recFor(s.id, 'Inspection'); S.photos = ir ? ir.photos.slice() : []; S.pendingId = null; S.view = 'inspect'; render(); window.scrollTo(0, 0);
          if (LIVE) ensurePhotos(S.photos).then(n => { if (n) drawPhotos(true); }); }
        else openCheck(s.id); break; }
      case 'toggleAdd': S.addOpen = !S.addOpen; $('add-form').hidden = !S.addOpen; if (S.addOpen) $('add-num').focus(); break;
      case 'addGo': { const n = $('add-num').value.trim(), type = $('add-type').value;
        if (!n) { $('add-num').classList.add('invalid'); toast('Type the system number'); return; }
        if (SYSTEMS.some(s => s.customer === S.visit.cust && s.building === S.visit.bldg && s.number === n)) { $('add-num').classList.add('invalid'); toast(`System ${n} already exists in ${S.visit.bldg}`); return; }
        const s = SYS(S.visit.cust, S.visit.bldg, n, type, $('add-heat').value, { suite: $('add-suite').value.trim() }); SYSTEMS.push(s); S.addOpen = false; openCheck(s.id); break; }
      case 'inspectNew': S.sys = { type: '' }; S.photos = []; S.pendingId = null; S.view = 'inspect'; render(); window.scrollTo(0, 0); break;
      case 'inspectSave': trySaveInspect(false); break;
      case 'inspectForce': $('sheet').innerHTML = ''; trySaveInspect(true); break;
      case 'back': case 'home': {
        if (S.view === 'login') break;
        const inForm = (S.role === 'tech' && S.view !== 'visit') || (S.role === 'admin' && S.admin === 'edit');
        const go = () => { $('sheet').innerHTML = ''; S.dirty = false; S.editing = null; if (S.role === 'tech') S.view = 'visit'; else S.admin = 'report'; render(); window.scrollTo(0, 0); };
        if (inForm && S.dirty) { sheet(`<h3>Leave without saving?</h3><div class="warn">Your answers for this system will be lost.</div>
          <div class="sheet-actions"><button type="button" class="btn" data-act="closeSheet">Stay</button><button type="button" class="btn primary" data-act="leave">Leave</button></div>`); S.leave = go; }
        else go(); break; }
      case 'leave': S.leave && S.leave(); break;
      case 'jump': $('s-' + t.dataset.i).scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
      case 'submit': trySubmit(); break;
      case 'closeSheet': $('sheet').innerHTML = ''; break;
      case 'keepEditing': $('sheet').innerHTML = ''; (S.missing || []).forEach(({ f }) => $('w-' + f.id).classList.add('invalid')); if (S.missing && S.missing[0]) $('w-' + S.missing[0].f.id).scrollIntoView({ behavior: 'smooth', block: 'center' }); break;
      case 'goNotes': $('sheet').innerHTML = ''; el('notes').classList.add('invalid'); el('notes').scrollIntoView({ behavior: 'smooth', block: 'center' }); break;
      case 'save': $('sheet').innerHTML = ''; saveCheck(); break;
      case 'photoFor': { $('sheet').innerHTML = ''; S.pendingTag = t.dataset.tag; const inp = document.querySelector('#photos input[data-photo][data-tag=""]'); if (inp) inp.click(); break; }
      case 'phDel': S.photos.splice(+t.dataset.i, 1); if (S.view === 'check' || S.admin === 'edit') derive(); drawPhotos(true); break;
      case 'phView': viewPhoto(S.photos[+t.dataset.i]); break;
      case 'recPhoto': viewPhoto(S.rec.photos[+t.dataset.i]); break;
      case 'readLabel': readLabel(+t.dataset.i); break;
      case 'stopRead': if (readCtl) readCtl.abort(); break;
      case 'undoLabel': { Object.entries(S.labelUndo || {}).forEach(([k, v]) => { const c = INSP.find(x => x.k === k); if (c.t === 'seg') setRadio('i-' + k, v); else { const x = $('i-' + k); if (c.t === 'list') { const items = LISTS[c.list]; if (!v || items.includes(v)) { x.value = v; if ($('i-' + k + '-o')) $('i-' + k + '-o').hidden = true; } else { x.value = '__o'; $('i-' + k + '-o').value = v; } } else x.value = v; } });
        document.querySelectorAll('.auto').forEach(x => x.classList.remove('auto', 'unsure')); $('ocr').hidden = true; toast('Label values removed'); break; }
      case 'adminTab': S.admin = t.dataset.v; S.editing = null; render(); window.scrollTo(0, 0); break;
      case 'openRec': S.rec = (LIVE ? S.adminRecs : RECORDS).find(r => r.id === t.dataset.id); S.admin = 'detail'; render(); window.scrollTo(0, 0); break;
      case 'editRec': openCheck(S.rec.systemId, S.rec); break;
      case 'cancelEdit': S.editing = null; S.admin = 'detail'; render(); window.scrollTo(0, 0); break;
      case 'preview': S.admin = 'preview'; render(); window.scrollTo(0, 0); break;
      case 'csv': csvDownload(); break;
      case 'print': window.print(); break;
      case 'signin': { const p = $('pin').value.trim(); if (!p) return; t.disabled = true; t.textContent = 'Signing in…'; signIn(p); break; }
      case 'who': whoMenu(); break;
      case 'switchRole': S.role = S.role === 'admin' ? 'tech' : 'admin'; S.view = 'visit'; S.admin = 'report'; S.editing = null; render(); window.scrollTo(0, 0); break;
      case 'reload': { $('sheet').innerHTML = ''; toast('Reloading…'); api('bootstrap').then(j => { applyBoot(j); S.statusKey = null; S.adminKey = null; render(); toast('Lists and systems reloaded'); }).catch(e => toast(e.message, 5000)); break; }
      case 'signout': store.set('fc_pin', null); Object.assign(API, { pin: '', name: '', role: '' }); RECORDS.length = 0; S.adminRecs = []; S.view = 'login'; render(); break;
      case 'listDel': LISTS[t.dataset.k].splice(+t.dataset.i, 1); render(); break;
      case 'listAdd': { const inp = $('add-' + t.dataset.k.replace(/\s/g, '_')), v = inp.value.trim(); if (!v) return; const L = LISTS[t.dataset.k];
        if (L.some(x => x.toLowerCase() === v.toLowerCase())) { toast(v + ' is already on the list'); return; } L.push(v); sortLists(); render(); toast('Added ' + v); break; }
      case 'ruleDel': PHOTO_RULES.splice(+t.dataset.i, 1); render(); break;
      case 'ruleAdd': { const r = { checklist: $('r-list').value.trim(), field: $('r-field').value.trim(), when: $('r-when').value.trim() };
        if (!r.checklist || !r.field || !r.when) { toast('Fill in checklist, field and when'); return; } PHOTO_RULES.push(r); render(); toast('Rule added'); break; }
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.closest && t.closest('#app') && ((S.role === 'tech' && S.view !== 'visit') || S.admin === 'edit')) S.dirty = true;
    if (t.id === 'opt-notes' || t.id === 'opt-shared') {
      if ((S.role === 'tech' && S.view === 'check') || (S.role === 'admin' && S.admin === 'edit')) { const keep = {}; Object.values(S.fmap).forEach(f => { keep[f.id] = getVal(f); }); render(); Object.entries(keep).forEach(([k, v]) => setVal(S.fmap[k], v)); S.tagKey = null; derive(); }
      else render(); return;
    }
    if (t.dataset.visit) { if (t.value === '__new') { sheet(`<h3>New building</h3><label class="fl">Building name<input id="new-bldg" placeholder="e.g. Building 3"></label><div class="sheet-actions"><button type="button" class="btn" data-act="closeSheet">Cancel</button><button type="button" class="btn primary" id="new-bldg-go">Add</button></div>`);
        $('new-bldg-go').onclick = () => { const b = $('new-bldg').value.trim(); if (!b) return; (S.extraBldgs[S.visit.cust] ||= []).push(b); S.visit.bldg = b; $('sheet').innerHTML = ''; render(); }; t.value = S.visit.bldg; return; }
      S.visit[t.dataset.visit] = t.value; render(); return; }
    if (t.dataset.af) { S.af[t.dataset.af] = t.value; if (t.dataset.af === 'cust') S.af.bldg = ''; render(); return; }
    if (t.dataset.setting) { SETTINGS[t.dataset.setting].v = Number(t.value); toast('Threshold updated'); return; }
    if (t.id === 'cust-version') { S.custVersion = t.checked; render(); return; }
    if (t.matches('input[data-photo]')) { const tag = S.pendingTag || t.dataset.tag; S.pendingTag = null; const files = [...t.files]; t.value = ''; if (files.length) addFiles(files, tag); return; }
    if (t.dataset.phtag !== undefined) { S.photos[+t.dataset.phtag].tag = t.value; if (S.view === 'check' || S.admin === 'edit') derive(); return; }
    if (S.view === 'inspect' && S.role === 'tech') { if (t.id === 'i-attn') S.iAttnManual = t.checked; if (t.id && $(t.id + '-o')) $(t.id + '-o').hidden = t.value !== '__o'; inspAuto(); return; }
    if ((S.role === 'tech' && S.view === 'check') || (S.role === 'admin' && S.admin === 'edit')) {
      if (t.id === 'f-attn') S.attnManual = t.checked;
      const raw = t.name || t.id.replace(/^f-/, '');
      const id = raw.replace(/-(k|q|s|o|na|r|x|d|dc|df|c|f)(-.*)?$/, '').replace(/-(c|f)$/, '');
      const f = S.fmap[id] || S.fmap[raw.split('-')[0]];
      if (f) { applyFills(f, (S.prev || {})[f.id], keyOf(f, getVal(f))); $('w-' + f.id).classList.remove('invalid'); }
      derive();
    }
  });
  document.addEventListener('input', e => {
    if (e.target.closest && e.target.closest('#app') && ((S.role === 'tech' && S.view !== 'visit') || S.admin === 'edit')) S.dirty = true;
    if (e.target.classList && e.target.classList.contains('auto')) e.target.classList.remove('auto', 'unsure');
    if ((S.role === 'tech' && S.view === 'check') || (S.role === 'admin' && S.admin === 'edit')) { if (e.target.matches('input, textarea')) { e.target.closest('.invalid')?.classList.remove('invalid'); e.target.classList.remove('invalid'); derive(); } }
  });

  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pin') document.querySelector('[data-act=signin]').click(); });
  if (LIVE) {
    $('who').dataset.act = 'who'; $('who').setAttribute('role', 'button'); $('who').tabIndex = 0;
    const saved = store.get('fc_pin');
    if (saved) { $('app').innerHTML = '<section class="card muted loading-row"><span class="spin"></span> Signing in…</section>'; signIn(saved, true); } else render();
  } else render();
})();
</script></body></html>
