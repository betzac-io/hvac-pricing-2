<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3261e">
<title>RTU Heat Check — Betz Heating &amp; Air</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #1d2433; --muted: #667085; --line: #d0d5dd; --chip: #eef0f3;
    --brand: #b3261e; --brand-ink: #fff;
    --green: #1a7f37; --yellow: #b8860b; --red: #c0261c; --na: #667085;
    --bad-bg: #fef3f2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #181c25; --ink: #e6e8ec; --muted: #98a2b3; --line: #344054; --chip: #222836; --bad-bg: #3d1714; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }

  .top { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 16px; background: var(--brand); color: var(--brand-ink); }
  .top strong { font-size: 18px; display: block; }
  .top small { font-size: 12px; opacity: .9; }
  .top-actions { display: flex; gap: 8px; align-items: center; }
  .pill { background: rgba(255,255,255,.18); color: #fff; border: 0; font: inherit; font-size: 13px; font-weight: 600;
    padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .pill.pending { background: #fff; color: var(--brand); }

  main { max-width: 680px; margin: 0 auto; padding: 12px 16px 110px; }

  /* Login */
  .login { max-width: 360px; margin: 48px auto; padding: 0 16px; text-align: center; }
  .login h1 { font-size: 22px; margin: 0 0 6px; }
  .login p { color: var(--muted); margin: 0 0 18px; }
  .login input { text-align: center; font-size: 28px; letter-spacing: .3em; }
  .login button { width: 100%; margin-top: 12px; }
  .login .err { color: var(--red); font-weight: 600; min-height: 1.4em; margin-top: 10px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 0 0 14px; }
  .card h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--brand); }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field > .lbl { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .field > .lbl .req { color: var(--red); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .row2 { display: grid; grid-template-columns: 96px 1fr; gap: 8px; }
  .row-other { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row-other.single { grid-template-columns: 1fr; }

  input, select, textarea { display: block; width: 100%; font: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 46px; }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); border-color: transparent; }
  .invalid { outline: 2px solid var(--red) !important; border-radius: 8px; }

  /* Segmented buttons */
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg label { flex: 1 1 0; min-width: 64px; position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; min-height: 0; }
  .seg span { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 46px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--chip); font-weight: 600; font-size: 15px; }
  .seg input:focus-visible + span { outline: 2px solid var(--brand); }
  .seg input:checked + span { color: #fff; border-color: transparent; background: var(--ink); }
  .seg input[value="Green"]:checked + span { background: var(--green); }
  .seg input[value="Yellow"]:checked + span { background: var(--yellow); }
  .seg input[value="Red"]:checked + span, .seg input[data-bad]:checked + span { background: var(--red); }
  .seg input[value="Not Applicable"]:checked + span { background: var(--na); }
  .seg input[value="Not Applicable"] + span { font-size: 13px; }

  #summary { list-style: none; margin: 0; padding: 0; }
  #summary li { background: var(--bad-bg); color: var(--red); font-weight: 600; font-size: 14px; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; }
  #summary li.ok { background: var(--chip); color: var(--muted); }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--card); border-top: 1px solid var(--line); z-index: 5; }
  button.btn { font: inherit; font-weight: 700; border-radius: 10px; min-height: 50px; border: 1px solid var(--line); cursor: pointer; padding: 0 16px; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn.secondary { background: var(--card); color: var(--ink); }
  .btn:disabled { opacity: .6; }
  .bar .primary { flex: 1; }

  /* Admin report */
  .datebar { display: flex; gap: 8px; align-items: center; }
  .datebar input { flex: 1; }
  .btn.sm { min-height: 46px; padding: 0 14px; font-size: 18px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .stat.alert b { color: var(--red); }
  .techline { font-size: 14px; color: var(--muted); margin: -4px 0 14px; }
  .bldg { font-size: 13px; font-weight: 700; color: var(--muted); margin: 12px 0 2px; text-transform: uppercase; letter-spacing: .03em; }
  .unit-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0;
    border-top: 1px solid var(--line); padding: 12px 0; font: inherit; color: inherit; cursor: pointer; }
  .unit-row .rtu { font-weight: 700; min-width: 64px; }
  .unit-row .meta { flex: 1; font-size: 14px; color: var(--muted); }
  .unit-row .chev { color: var(--muted); }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); margin-left: 4px; }
  .badge-ok, .badge-bad { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .badge-ok { background: var(--chip); color: var(--green); }
  .badge-bad { background: var(--bad-bg); color: var(--red); }
  .empty { text-align: center; color: var(--muted); padding: 28px 0; }
  .detail-head h2 { color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 19px; margin: 0 0 4px; }
  .detail-head .sub { color: var(--muted); font-size: 14px; }
  .kv { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .kv .k { color: var(--muted); }
  .kv .v { font-weight: 600; text-align: right; white-space: pre-wrap; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; color: #fff; font-size: 13px; background: var(--ink); }
  .chip.Green { background: var(--green); } .chip.Yellow { background: var(--yellow); }
  .chip.Red, .chip.bad { background: var(--red); } .chip.na { background: var(--na); }
  .detail-actions { display: flex; gap: 10px; margin-bottom: 14px; }
  .detail-actions .btn { flex: 1; }
  #toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; max-width: 90vw; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="top">
  <div><strong>RTU Heat Check</strong><small id="whoami">Betz Heating &amp; Air</small></div>
  <div class="top-actions">
    <button type="button" id="queueBadge" class="pill pending" hidden title="Tap to retry sending">0 pending</button>
    <button type="button" id="logoutBtn" class="pill" hidden>Log out</button>
  </div>
</header>

<!-- PIN LOGIN -->
<section id="loginView" class="login" hidden>
  <img src="logo.png" alt="Betz Heating &amp; Air" style="width:56px;height:56px;object-fit:contain;border-radius:12px;margin-bottom:12px" onerror="this.remove()">
  <h1>RTU Heat Check</h1>
  <p>Enter the same PIN you use for Commissions.</p>
  <form id="loginForm" autocomplete="off">
    <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" required aria-label="PIN">
    <button class="btn primary" type="submit" id="loginBtn">Log in</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<!-- FORM -->
<main id="formView" hidden>
  <form id="hcForm" novalidate autocomplete="off"></form>
</main>

<!-- ADMIN: DAILY REPORT -->
<main id="adminView" hidden>
  <div class="card">
    <div class="datebar">
      <button type="button" class="btn secondary sm" id="prevDay" aria-label="Previous day">‹</button>
      <input type="date" id="repDate" aria-label="Report date">
      <button type="button" class="btn secondary sm" id="nextDay" aria-label="Next day">›</button>
    </div>
  </div>
  <div id="repBody"></div>
</main>

<!-- ADMIN: UNIT DETAIL -->
<main id="detailView" hidden></main>

<div class="bar" id="bar" hidden>
  <button type="button" class="btn secondary" id="clearBtn">Clear</button>
  <button type="submit" form="hcForm" class="btn primary" id="submitBtn">Submit</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  // ================= CONFIG =================
  // Commission Portal Apps Script deployment (HeatCheck.gs adds the doPost this page uses)
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxjLvUCd62DrCFOgTmnvBBOcLwZmkhQcczKxsbMQUnUzU_De59C2DXDHqnbq2U5fjfd/exec';

  const CUSTOMERS = ['United Notions', 'Redstone', 'Presidential', 'Integrity Porter', 'Quebec', 'Indian Trail'];
  const GR  = ['Green', 'Red'];
  const GYR = ['Green', 'Yellow', 'Red'];
  const NA  = 'Not Applicable';
  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => String(a + i));

  // Field keys are the exact labels from the checklist — they become the sheet's column headers.
  // always: true = shown even when the unit has no heat.
  const SECTIONS = [
    { title: 'Unit', always: true, fields: [
      { k: 'Customer', t: 'combo', opts: CUSTOMERS, req: true },
      { k: 'Building', t: 'select', opts: range(1, 10), req: true },
      { k: 'RTU', t: 'select', opts: range(1, 50), req: true },
      { k: 'Does Unit have Heat?', t: 'seg', opts: ['Yes', 'No'], req: true },
    ]},
    { title: 'Filters', always: true, fields: [
      { k: 'Filter Size 1', t: 'qtySize' },
      { k: 'Filter Size 2', t: 'qtySize' },
      { k: 'Filter Condition', t: 'seg', opts: ['Changed', 'Clean'] },
    ]},
    { title: 'Belt & Blower', fields: [
      { k: 'Belt Size', t: 'text' },
      { k: 'Belt Condition', t: 'seg', opts: GR },
      { k: 'Blower Motor Run Capacitor', t: 'other', opts: ['5', '7.5', '10', '12.5', '15', '20'], unit: 'µF' },
      { k: 'Blower Motor Run Capacitor Condition', t: 'seg', opts: GYR },
      { k: 'Is Blower Wheel Clean', t: 'seg', opts: ['Yes', 'No'], bad: 'No' },
      { k: 'Blower Motor Amp Draw', t: 'number', unit: 'A' },
    ]},
    { title: 'Inducer', fields: [
      { k: 'Inducer Fan Motor 1 Run Capacitor Size', t: 'other', opts: ['3', '4', '5', '6'], unit: 'µF' },
      { k: 'Inducer Fan Motor 1 Run Capacitor Condition', t: 'seg', opts: GYR },
      { k: 'Inducer Fan Motor 2 Run Capacitor Size', t: 'other', opts: ['3', '4', '5', '6', NA], unit: 'µF' },
      { k: 'Inducer Fan Motor 2 Run Capacitor Condition', t: 'seg', opts: [...GYR, NA] },
    ]},
    { title: 'Gas, Electrical & Safeties', fields: [
      { k: 'Gas Valve 1', t: 'seg', opts: GR },
      { k: 'Gas Valve 2', t: 'seg', opts: [...GR, NA] },
      { k: 'High Voltage Condition', t: 'seg', opts: GR },
      { k: 'Low Voltage Condition', t: 'seg', opts: GR },
      { k: 'Heat Exchanger 1 Condition', t: 'seg', opts: GYR },
      { k: 'Heat Exchanger 2 Condition', t: 'seg', opts: [...GYR, NA] },
      { k: 'Spark Ignitor 1 Condition', t: 'seg', opts: GR },
      { k: 'Spark Ignitor 2 Condition', t: 'seg', opts: [...GR, NA] },
      { k: 'High Limit Condition', t: 'seg', opts: GR },
      { k: 'Safeties Condition', t: 'seg', opts: GR },
      { k: 'Flame Sensor Condition', t: 'seg', opts: ['Sanded', 'Good', 'Bad'], bad: 'Bad',
        hint: 'Good = working but not easily accessible' },
      { k: 'Gas Leaks Detected', t: 'seg', opts: ['Yes', 'No'], bad: 'Yes' },
      { k: 'Is Thermostat Working Properly', t: 'seg', opts: ['Yes', 'No'], bad: 'No' },
    ]},
    { title: 'Notes', always: true, fields: [
      { k: 'Other Notes', t: 'textarea' },
    ]},
  ];
  // ===========================================

  const KEYS = { session: 'betzRtuSession', queue: 'betzRtuQueue', draft: 'betzRtuDraft', lastCustomer: 'betzRtuLastCustomer', customCustomers: 'betzRtuCustomCustomers' };
  const $ = id => document.getElementById(id);
  const form = $('hcForm');
  const HEAT = 'Does Unit have Heat?';
  let session = null;
  let editing = null;      // admin: { rec } while editing a saved check
  let dayRows = [];        // admin: checks for the report date

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} }
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let uid = 0; const nid = () => 'f' + (++uid);

  function toast(msg, ms = 3000) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
  }

  // ---------- Backend calls (same Apps Script as the sheet) ----------
  const configured = () => /^https:\/\/script\.google\.com\//.test(SCRIPT_URL);
  async function api(payload) {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload)
    });
    return res.json();
  }

  // ---------- Customers ----------
  function customerList() {
    const extra = store.get(KEYS.customCustomers, []).filter(c => !CUSTOMERS.includes(c));
    return [...CUSTOMERS, ...extra];
  }
  function rememberCustomer(name) {
    if (!name) return;
    store.set(KEYS.lastCustomer, name);
    if (CUSTOMERS.includes(name)) return;
    const extra = store.get(KEYS.customCustomers, []);
    if (!extra.includes(name)) { extra.push(name); store.set(KEYS.customCustomers, extra.slice(-30)); }
    const sel = el('Customer');
    if (sel && ![...sel.options].some(o => o.value === name)) sel.add(new Option(name, name), sel.options.length - 1);
  }
  function setCustomer(name) {
    const sel = el('Customer');
    if (!name) { sel.value = ''; return; }
    if (![...sel.options].some(o => o.value === name)) sel.add(new Option(name, name), sel.options.length - 1);
    sel.value = name;
    el('Customer__other').value = '';
  }
  const customerField = () => SECTIONS[0].fields[0];

  // ---------- Build form from SECTIONS ----------
  function fieldHTML(f) {
    const id = nid(), name = esc(f.k);
    const lbl = `<span class="lbl">${esc(f.k)}${f.req ? ' <span class="req">*</span>' : ''}</span>`;
    const hint = f.hint ? `<div class="hint">${esc(f.hint)}</div>` : '';
    let ctl = '';
    switch (f.t) {
      case 'combo':
        ctl = `<div class="row-other single">
                 <select id="${id}" name="${name}" data-other ${f.req ? 'required' : ''}><option value="">Select…</option>${customerList().map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('')}<option value="__other">Other…</option></select>
                 <input name="${name}__other" placeholder="Customer name" hidden aria-label="New customer name">
               </div>`;
        return `<div class="field"><label class="lbl" for="${id}">${esc(f.k)}${f.req ? ' <span class="req">*</span>' : ''}</label>${ctl}${hint}</div>`;
      case 'select':
        ctl = `<select id="${id}" name="${name}" ${f.req ? 'required' : ''}><option value="">Select…</option>${f.opts.map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
        return `<div class="field"><label class="lbl" for="${id}">${esc(f.k)}${f.req ? ' <span class="req">*</span>' : ''}</label>${ctl}${hint}</div>`;
      case 'seg':
        ctl = `<div class="seg" role="radiogroup" aria-label="${name}" data-req="${f.req ? 1 : ''}">${f.opts.map(o =>
          `<label><input type="radio" name="${name}" value="${esc(o)}" ${f.bad === o ? 'data-bad' : ''}><span>${esc(o)}</span></label>`).join('')}</div>`;
        return `<div class="field">${lbl}${ctl}${hint}</div>`;
      case 'qtySize':
        ctl = `<div class="row2">
                 <select name="${name}__qty" aria-label="${name} quantity"><option value="">Qty</option>${range(1, 10).map(o => `<option>${o}</option>`).join('')}</select>
                 <input name="${name}__size" placeholder="Size, e.g. 20x25x2" aria-label="${name} size">
               </div>`;
        return `<div class="field">${lbl}${ctl}${hint}</div>`;
      case 'other':
        ctl = `<div class="row-other single">
                 <select id="${id}" name="${name}" data-other><option value="">Select…</option>${f.opts.map(o => `<option value="${esc(o)}">${esc(o)}${o !== NA && f.unit ? ' ' + f.unit : ''}</option>`).join('')}<option value="__other">Other…</option></select>
                 <input name="${name}__other" inputmode="decimal" placeholder="Custom ${f.unit || ''}" hidden aria-label="${name} custom value">
               </div>`;
        return `<div class="field"><label class="lbl" for="${id}">${esc(f.k)}</label>${ctl}${hint}</div>`;
      case 'number':
        return `<div class="field"><label class="lbl" for="${id}">${esc(f.k)}${f.unit ? ` <span class="hint">(${f.unit})</span>` : ''}</label>
                <input id="${id}" name="${name}" type="number" inputmode="decimal" step="any">${hint}</div>`;
      case 'textarea':
        return `<div class="field"><label class="lbl" for="${id}">${esc(f.k)}</label><textarea id="${id}" name="${name}"></textarea>${hint}</div>`;
      default:
        return `<div class="field"><label class="lbl" for="${id}">${esc(f.k)}</label><input id="${id}" name="${name}">${hint}</div>`;
    }
  }

  function buildForm() {
    form.innerHTML =
      `<div class="card"><div class="field" style="margin:0"><span class="lbl">Date / Time</span><div id="nowOut" class="hint" style="font-size:15px;color:inherit">Stamped when you submit</div></div></div>` +
      SECTIONS.map((s, i) => `<section class="card" data-sec="${i}" ${s.always ? 'data-always' : ''}><h2>${esc(s.title)}</h2>${s.fields.map(fieldHTML).join('')}</section>`).join('') +
      `<section class="card"><h2>Needs attention</h2><ul id="summary"></ul></section>`;
  }

  // ---------- Read / write values ----------
  const el = name => form.elements.namedItem(name);
  function radioVal(name) { const r = form.querySelector(`input[type=radio][name="${CSS.escape(name)}"]:checked`); return r ? r.value : ''; }

  function fieldValue(f) {
    switch (f.t) {
      case 'seg': return radioVal(f.k);
      case 'qtySize': {
        const q = el(f.k + '__qty').value, s = el(f.k + '__size').value.trim();
        return q || s ? `${q || '?'} × ${s || '?'}` : '';
      }
      case 'combo':
      case 'other': {
        const v = el(f.k).value;
        return v === '__other' ? el(f.k + '__other').value.trim() : v;
      }
      default: return el(f.k).value.trim();
    }
  }

  const hasHeat = () => radioVal(HEAT) !== 'No';

  function applyVisibility() {
    const show = hasHeat();
    form.querySelectorAll('section[data-sec]:not([data-always])').forEach(s => { s.hidden = !show; });
    form.querySelectorAll('select[data-other]').forEach(sel => {
      const other = sel.parentElement.querySelector('input');
      const on = sel.value === '__other';
      other.hidden = !on; sel.parentElement.classList.toggle('single', !on);
    });
    updateSummary();
  }

  const isFlagged = (f, v) => !!v && (v === 'Red' || v === 'Yellow' || (f.bad && v === f.bad));
  function issuesFor(rec) {
    const items = [], heat = rec[HEAT] !== 'No';
    SECTIONS.forEach(s => { if (s.always || heat) s.fields.forEach(f => { const v = String(rec[f.k] ?? ''); if (isFlagged(f, v)) items.push(`${f.k}: ${v}`); }); });
    return items;
  }
  function updateSummary() {
    const items = [];
    SECTIONS.forEach(s => {
      if (!s.always && !hasHeat()) return;
      s.fields.forEach(f => { const v = fieldValue(f); if (isFlagged(f, v)) items.push(`${f.k}: ${v}`); });
    });
    $('summary').innerHTML = items.length
      ? items.map(i => `<li>${esc(i)}</li>`).join('')
      : '<li class="ok">Nothing flagged Red, Yellow, or failed</li>';
  }

  // ---------- Draft (survives app switching / dead screen) ----------
  function saveDraft() {
    if (editing) return;
    const d = {};
    Array.from(form.elements).forEach(e => {
      if (!e.name) return;
      if (e.type === 'radio') { if (e.checked) d[e.name] = e.value; }
      else d[e.name] = e.value;
    });
    store.set(KEYS.draft, d);
  }
  function restore(d) {
    Array.from(form.elements).forEach(e => {
      if (!e.name || !(e.name in d)) return;
      if (e.type === 'radio') e.checked = d[e.name] === e.value; else e.value = d[e.name];
    });
  }
  function freshForm(keep = {}) {
    form.reset();
    setCustomer(keep.Customer ?? store.get(KEYS.lastCustomer, ''));
    if (keep.Building) el('Building').value = keep.Building;
    if (keep.RTU) el('RTU').value = keep.RTU;
    store.del(KEYS.draft);
    applyVisibility();
  }

  // ---------- Collect record in checklist column order ----------
  function stamp() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function collect() {
    const rec = { 'Date / Time': stamp(), 'Technician': session.name };
    const heat = hasHeat();
    SECTIONS.forEach(s => s.fields.forEach(f => { rec[f.k] = (s.always || heat) ? fieldValue(f) : ''; }));
    return {
      id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2),
      pin: session.pin,
      record: rec
    };
  }

  function validate() {
    let first = null;
    form.querySelectorAll('.invalid').forEach(e => e.classList.remove('invalid'));
    SECTIONS.forEach(s => s.fields.forEach(f => {
      if (!f.req || fieldValue(f)) return;
      const target = f.t === 'seg' ? form.querySelector(`.seg[aria-label="${CSS.escape(f.k)}"]`) : el(f.k);
      target.classList.add('invalid'); first = first || target;
    }));
    if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); toast('Fill in the required fields'); }
    return !first;
  }

  // ---------- Offline-safe queue ----------
  function updateBadge() {
    const q = store.get(KEYS.queue, []);
    $('queueBadge').hidden = !q.length; $('queueBadge').textContent = `${q.length} pending`;
  }
  let flushing = false;
  async function flush() {
    let q = store.get(KEYS.queue, []);
    if (flushing || !configured() || !q.length) { updateBadge(); return { left: q.length, rejected: 0 }; }
    flushing = true; let rejected = 0;
    for (const item of [...q]) {
      let res;
      try { res = await api({ action: 'submit', ...item }); }
      catch { break; } // offline — keep the rest queued
      if (res && res.ok) q = q.filter(x => x.id !== item.id);
      else if (res && res.error === 'bad_pin') { rejected++; }
      store.set(KEYS.queue, q);
    }
    flushing = false; updateBadge();
    return { left: q.length, rejected };
  }

  // ---------- Login ----------
  const isAdmin = () => session && session.role === 'admin';
  // view: 'login' | 'form' (tech entry or admin edit) | 'report' | 'detail'
  function showView(view) {
    ['loginView', 'formView', 'adminView', 'detailView'].forEach(id => $(id).hidden = true);
    $({ login: 'loginView', form: 'formView', report: 'adminView', detail: 'detailView' }[view]).hidden = false;
    $('bar').hidden = view !== 'form';
    $('logoutBtn').hidden = view === 'login';
    $('whoami').textContent = session ? (isAdmin() ? 'Admin' : session.name) : 'Betz Heating & Air';
    $('clearBtn').textContent = editing ? 'Cancel' : 'Clear';
    $('submitBtn').textContent = editing ? 'Save changes' : 'Submit';
    window.scrollTo(0, 0);
    if (view === 'login') setTimeout(() => $('pinInput').focus(), 50);
  }
  const homeView = () => session ? (isAdmin() ? 'report' : 'form') : 'login';

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pin = $('pinInput').value.trim();
    if (!pin) return;
    $('loginErr').textContent = '';
    if (!configured()) { $('loginErr').textContent = 'Apps Script URL not set in this page yet.'; return; }
    $('loginBtn').disabled = true; $('loginBtn').textContent = 'Checking…';
    try {
      const res = await api({ action: 'verifyPin', pin });
      if (res.ok) {
        session = { name: res.name, pin, role: res.role || 'tech' };
        store.set(KEYS.session, session);
        $('pinInput').value = '';
        showView(homeView()); flush();
        if (isAdmin()) loadDay();
      } else $('loginErr').textContent = 'PIN not recognized.';
    } catch {
      $('loginErr').textContent = 'No connection — need signal to log in the first time.';
    }
    $('loginBtn').disabled = false; $('loginBtn').textContent = 'Log in';
  });

  $('logoutBtn').addEventListener('click', () => {
    if (!confirm(isAdmin() ? 'Log out of admin?' : 'Log out? Your in-progress entry stays on this phone.')) return;
    if (editing) leaveEdit();
    session = null; store.del(KEYS.session); showView('login');
  });

  // ---------- Form events ----------
  form.addEventListener('input', e => { e.target.closest('.invalid, .seg')?.classList.remove('invalid'); e.target.classList.remove('invalid'); saveDraft(); updateSummary(); });
  form.addEventListener('change', e => {
    if (e.target.name === 'Customer' || e.target.name === 'Customer__other') {
      const c = fieldValue(customerField());
      if (c && c !== '__other') store.set(KEYS.lastCustomer, c);
    }
    applyVisibility(); saveDraft();
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!validate()) return;
    if (editing) return saveEdit();
    const item = collect();
    const rec = item.record;
    if (!confirm(`Submit heat check?\n\n${rec.Customer} — Building ${rec.Building}, RTU ${rec.RTU}`)) return;
    const q = store.get(KEYS.queue, []); q.push(item); store.set(KEYS.queue, q);
    rememberCustomer(item.record.Customer);

    $('submitBtn').disabled = true; $('submitBtn').textContent = 'Sending…';
    const r = await flush();
    $('submitBtn').disabled = false; $('submitBtn').textContent = 'Submit';

    // Next unit on the same roof: keep customer + building, bump RTU
    const nextRtu = Math.min(50, (parseInt(item.record.RTU, 10) || 0) + 1);
    freshForm({ Customer: item.record.Customer, Building: item.record.Building, RTU: String(nextRtu) });
    window.scrollTo({ top: 0, behavior: 'smooth' });

    const label = `Bldg ${item.record.Building} RTU ${item.record.RTU}`;
    if (!configured()) toast(`${label} saved on this phone — Apps Script URL not set`, 4000);
    else if (r.rejected) toast('PIN rejected by the sheet — log out and back in', 5000);
    else if (r.left) toast(`No signal — ${label} saved, will send when back online`, 4000);
    else toast(`${label} submitted ✓  Now on RTU ${nextRtu}`);
  });

  $('clearBtn').addEventListener('click', () => {
    if (editing) { if (confirm('Discard your changes?')) { const id = editing.rec['Record ID']; leaveEdit(); showDetail(id); } return; }
    if (confirm('Clear this unit? Customer and building stay filled in.'))
      freshForm({ Customer: fieldValue(customerField()), Building: el('Building').value });
  });
  $('queueBadge').addEventListener('click', async () => {
    const r = await flush();
    toast(r.left ? `${r.left} still pending — check signal` : 'All pending checks sent ✓');
  });
  window.addEventListener('online', flush);

  // ================= ADMIN =================
  const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const shiftDay = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  const timeOf = dt => { const m = /(\d{2}):(\d{2})/.exec(dt || ''); if (!m) return ''; const h = +m[1]; return `${(h % 12) || 12}:${m[2]} ${h < 12 ? 'AM' : 'PM'}`; };
  const num = v => parseInt(v, 10) || 0;
  const unitLabel = r => `${r.Customer} — Building ${r.Building}, RTU ${r.RTU}`;

  async function loadDay() {
    const date = $('repDate').value || todayISO();
    $('repDate').value = date;
    $('repBody').innerHTML = '<div class="empty">Loading…</div>';
    try {
      const res = await api({ action: 'adminDay', pin: session.pin, date });
      if (!res.ok) { $('repBody').innerHTML = `<div class="empty">${res.error === 'bad_pin' ? 'Admin PIN no longer valid — log out and back in.' : 'Could not load report.'}</div>`; return; }
      dayRows = res.rows;
      renderDay(date);
    } catch {
      $('repBody').innerHTML = '<div class="empty">No connection — pull up again when you have signal.</div>';
    }
  }

  function renderDay(date) {
    const rows = dayRows;
    const nice = new Date(date + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    if (!rows.length) { $('repBody').innerHTML = `<div class="empty">No heat checks on ${esc(nice)}.</div>`; return; }

    const withIssues = rows.filter(r => issuesFor(r).length).length;
    const noHeat = rows.filter(r => r[HEAT] === 'No').length;
    const filters = rows.filter(r => r['Filter Condition'] === 'Changed').length;
    const techs = {}; rows.forEach(r => { techs[r.Technician] = (techs[r.Technician] || 0) + 1; });

    // Customer → Building → units
    const groups = {};
    rows.forEach(r => { ((groups[r.Customer] ||= {})[r.Building] ||= []).push(r); });

    let html = `
      <div class="stats">
        <div class="stat"><b>${rows.length}</b><span>Units checked</span></div>
        <div class="stat ${withIssues ? 'alert' : ''}"><b>${withIssues}</b><span>Units with issues</span></div>
        <div class="stat"><b>${filters}</b><span>Filters changed</span></div>
        <div class="stat"><b>${noHeat}</b><span>No-heat units</span></div>
      </div>
      <div class="techline">${esc(nice)} · ${Object.entries(techs).map(([t, n]) => `${esc(t)} (${n})`).join(' · ')}</div>`;

    Object.keys(groups).sort().forEach(cust => {
      html += `<section class="card"><h2>${esc(cust)}</h2>`;
      Object.keys(groups[cust]).sort((a, b) => num(a) - num(b)).forEach(b => {
        html += `<div class="bldg">Building ${esc(b)}</div>`;
        groups[cust][b].sort((x, y) => num(x.RTU) - num(y.RTU)).forEach(r => {
          const n = issuesFor(r).length;
          html += `<button type="button" class="unit-row" data-id="${esc(r['Record ID'])}">
            <span class="rtu">RTU ${esc(r.RTU)}</span>
            <span class="meta">${esc(r.Technician)} · ${timeOf(r['Date / Time'])}${r[HEAT] === 'No' ? '<span class="tag">No heat</span>' : ''}</span>
            ${n ? `<span class="badge-bad">${n} issue${n > 1 ? 's' : ''}</span>` : '<span class="badge-ok">OK</span>'}
            <span class="chev">›</span></button>`;
        });
      });
      html += '</section>';
    });
    $('repBody').innerHTML = html;
  }

  $('repBody').addEventListener('click', e => { const b = e.target.closest('.unit-row'); if (b) showDetail(b.dataset.id); });
  $('repDate').addEventListener('change', loadDay);
  $('prevDay').addEventListener('click', () => { $('repDate').value = shiftDay($('repDate').value || todayISO(), -1); loadDay(); });
  $('nextDay').addEventListener('click', () => { $('repDate').value = shiftDay($('repDate').value || todayISO(), 1); loadDay(); });

  function chipFor(f, v) {
    if (!v) return '<span class="v" style="color:var(--muted);font-weight:400">—</span>';
    let cls = '';
    if (['Green', 'Yellow', 'Red'].includes(v)) cls = v; else if (v === NA) cls = 'na'; else if (f.bad && v === f.bad) cls = 'bad';
    return cls ? `<span class="v"><span class="chip ${cls}">${esc(v)}</span></span>` : `<span class="v">${esc(v)}${f.unit && /^[\d.]+$/.test(v) ? ' ' + f.unit : ''}</span>`;
  }

  function showDetail(id) {
    const r = dayRows.find(x => x['Record ID'] === id);
    if (!r) { showView('report'); return; }
    const issues = issuesFor(r), heat = r[HEAT] !== 'No';
    let html = `
      <div class="detail-actions">
        <button type="button" class="btn secondary" id="backBtn">‹ Back</button>
        <button type="button" class="btn primary" id="editBtn">Edit</button>
      </div>
      <section class="card detail-head"><h2>${esc(unitLabel(r))}</h2>
        <div class="sub">${esc(r.Technician)} · ${esc(r['Date / Time'])}</div></section>
      <section class="card"><h2>Needs attention</h2><ul id="dsum" style="list-style:none;margin:0;padding:0">${
        issues.length ? issues.map(i => `<li style="background:var(--bad-bg);color:var(--red);font-weight:600;font-size:14px;padding:8px 10px;border-radius:8px;margin-bottom:6px">${esc(i)}</li>`).join('')
                      : '<li style="color:var(--muted)">Nothing flagged Red, Yellow, or failed</li>'}</ul></section>`;
    SECTIONS.forEach(s => {
      if (!s.always && !heat) return;
      const fields = s.fields.filter(f => !['Customer', 'Building', 'RTU'].includes(f.k));
      if (!fields.length) return;
      html += `<section class="card"><h2>${esc(s.title)}</h2>${fields.map(f => `<div class="kv"><span class="k">${esc(f.k)}</span>${chipFor(f, String(r[f.k] ?? ''))}</div>`).join('')}</section>`;
    });
    if (!heat) html += '<section class="card"><div class="hint" style="font-size:14px">Unit has no heat — heat checks were skipped.</div></section>';
    $('detailView').innerHTML = html;
    $('backBtn').onclick = () => showView('report');
    $('editBtn').onclick = () => startEdit(r);
    showView('detail');
  }

  // ---- Edit: load a saved check into the same form techs use ----
  function setFieldValue(f, v) {
    v = v == null ? '' : String(v);
    switch (f.t) {
      case 'seg': form.querySelectorAll(`input[type=radio][name="${CSS.escape(f.k)}"]`).forEach(r => r.checked = r.value === v); break;
      case 'combo': setCustomer(v); break;
      case 'qtySize': {
        const m = /^(.*?)\s*×\s*(.*)$/.exec(v);
        const q = m ? m[1].trim() : '', sz = m ? m[2].trim() : v;
        el(f.k + '__qty').value = q === '?' ? '' : q;
        el(f.k + '__size').value = sz === '?' ? '' : sz;
        break;
      }
      case 'other': {
        const sel = el(f.k);
        if (!v) sel.value = '';
        else if (f.opts.includes(v)) sel.value = v;
        else { sel.value = '__other'; el(f.k + '__other').value = v; }
        break;
      }
      default: el(f.k).value = v;
    }
  }

  function startEdit(r) {
    editing = { rec: r };
    form.reset();
    SECTIONS.forEach(s => s.fields.forEach(f => setFieldValue(f, r[f.k])));
    $('nowOut').textContent = `Editing check by ${r.Technician} · ${r['Date / Time']}`;
    applyVisibility();
    showView('form');
  }

  function leaveEdit() {
    editing = null;
    form.reset();
    $('nowOut').textContent = 'Stamped when you submit';
    const d = store.get(KEYS.draft, null);
    if (d) restore(d); else setCustomer(store.get(KEYS.lastCustomer, ''));
    applyVisibility();
  }

  async function saveEdit() {
    const record = {}, heat = hasHeat();
    SECTIONS.forEach(s => s.fields.forEach(f => { record[f.k] = (s.always || heat) ? fieldValue(f) : ''; }));
    if (!confirm(`Save changes?\n\n${unitLabel(record)}`)) return;
    const id = editing.rec['Record ID'];
    $('submitBtn').disabled = true; $('submitBtn').textContent = 'Saving…';
    try {
      const res = await api({ action: 'adminUpdate', pin: session.pin, id, record });
      if (!res.ok) { toast(res.error === 'not_found' ? 'That check was deleted from the sheet' : 'Could not save changes', 4000); return; }
      const i = dayRows.findIndex(x => x['Record ID'] === id);
      if (i > -1) dayRows[i] = res.record || { ...dayRows[i], ...record };
      leaveEdit();
      renderDay($('repDate').value);
      showDetail(id);
      toast('Changes saved ✓');
    } catch {
      toast('No connection — changes not saved yet. Try again.', 4000);
    } finally {
      $('submitBtn').disabled = false; $('submitBtn').textContent = editing ? 'Save changes' : 'Submit';
    }
  }

  // ---------- Init ----------
  buildForm();
  const draft = store.get(KEYS.draft, null);
  if (draft) { restore(draft); applyVisibility(); } else freshForm();
  session = store.get(KEYS.session, null);
  if (session && !session.role) session.role = 'tech';
  showView(homeView());
  if (isAdmin()) loadDay();
  updateBadge(); if (session) flush();
})();
</script>
</body>
</html>
